<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API HTML Application</title>
  <link rel="stylesheet" href="Task/libs/css/Style.css">
</head>
<body>
  <div id="preloader"></div>

  <h1>My HTML Application</h1>
  <table>
    <thead>
      <tr>
        <th>API Name</th>
        <th>API Description</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Street Name Lookup -->
      <tr>
        <td>StreetNameLookUp</td>
        <td>
          Enter street name:
          <input type="text" id="streetName" placeholder="Street Name">
        </td>
        <td>
          <button id="btnStreetLookUp">Submit</button>
        </td>
      </tr>

      <!-- Weather Lookup -->
      <tr>
        <td>Weather</td>
        <td>
          Enter location:
          <input type="text" id="location" placeholder="Location">
        </td>
        <td>
          <button id="btnWeather">Submit</button>
        </td>
      </tr>

      <!-- Country Code Lookup -->
      <tr>
        <td>CountryCode</td>
        <td>
          Enter country name:
          <input type="text" id="countryName" placeholder="Country Name">
        </td>
        <td>
          <button id="btnCountryCode">Submit</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Results Section -->
  <h2>Results</h2>
  <div>
    <h3>Street Lookup Result</h3>
    <div id="txtStreetResult">No results yet.</div>
  </div>
  <div>
    <h3>Weather Result</h3>
    <div id="txtWeatherResult">No results yet.</div>
  </div>
  <div>
    <h3>Country Code Result</h3>
    <div id="txtCountryCodeResult">No results yet.</div>
  </div>

  <!-- JavaScript -->
  <script src="Task/libs/Js/Script.js"></script>
</body>
</html>
