<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazetteer Map</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="css/leaflet.css">
    <!-- EasyButton CSS -->
    <link rel="stylesheet" href="css/easy-button.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        #selectContainer {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        #countrySelect {
            width: 200px;
            padding: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Country Selection Dropdown on Map -->
    <div id="map">
        <span id="selectContainer">
            <select id="countrySelect" class="form-select shadow-sm">
                <option value="">Select a Country</option>
            </select>
        </span>
    </div>

    <!-- 5 Modals with 2 pieces of data each -->
    <div id="modals-container">
        <!-- Modal 1: Country Name and Capital -->
        <div id="modal1" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title">Country & Capital</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Country:</strong> <span id="countryNames"></span></p>
                        <p><strong>Capital City:</strong> <span id="capitalCity"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal 2: Population and Currency -->
        <div id="modal2" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-info text-white">
                        <h5 class="modal-title">Population & Currency</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Population:</strong> <span id="population"></span></p>
                        <p><strong>Currency:</strong> <span id="currencyName"></span> (<span id="currencySymbol"></span>)</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal 3: Exchange Rate and Timezone -->
        <div id="modal3" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-warning text-dark">
                        <h5 class="modal-title">Exchange Rate & Timezone</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Exchange Rate:</strong> <span id="txtCurrencyRate"></span></p>
                        <p><strong>Timezone:</strong> <span id="timezone"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal 4: Current Weather and 10-Day Forecast -->
        <div id="modal4" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">Weather Info</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Current Temperature:</strong> <span id="tempToday"></span></p>
                        <p><strong>Conditions:</strong> <span id="conditionsToday"></span></p>
                        <p><strong>10-Day Forecast:</strong> <div id="forecastInfo"></div></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal 5: Wikipedia Info and Earthquake Data -->
        <div id="modal5" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title">Wikipedia & Earthquakes</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Wikipedia:</strong> <a id="wikiLink" href="#" target="_blank">View on Wikipedia</a></p>
                        <p><strong>Recent Earthquakes:</strong> <div id="earthquakeList"></div></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="Js/bootstrap.bundle.min.js"></script>
    <script src="Js/jquery-3.7.1.min.js"></script>
    <script src="Js/leaflet.js"></script>
    <script src="Js/easy-button.js"></script>
    <script src="Js/script.js"></script>
</body>
</html>
