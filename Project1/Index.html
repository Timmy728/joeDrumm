<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazetteer</title>
  
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/MarkerCluster.css">
    <link rel="stylesheet" href="css/MarkerCluster.Default.css">
    
    <!-- Leaflet EasyButton CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-easybutton/2.4.0/easy-button.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="preloader">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    
    <span id="selectContainer">
        <select id="selCountry" class="form-select shadow-sm">
            <!-- Populated via AJAX -->
            <option value="">Select a Country</option>
        </select>
    </span>
    
    <div id="map"></div>
    
    <!-- Information Modal -->
    <div id="infoModal" class="modal fade" data-bs-backdrop="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content shadow">
                <div class="modal-header bg-success bg-gradient text-white">
                    <h5 class="modal-title">Country Overview</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped">
                        <tr>
                            <td class="text-center"><i class="fa-solid fa-globe fa-xl text-success"></i></td>
                            <td>Country</td>
                            <td class="text-end" id="modalCountryName"></td>
                        </tr>
                        <tr>
                            <td class="text-center"><i class="fa-solid fa-city fa-xl text-success"></i></td>
                            <td>Capital</td>
                            <td class="text-end" id="modalCapitalCity"></td>
                        </tr>
                        <tr>
                            <td class="text-center"><i class="fa-solid fa-users fa-xl text-success"></i></td>
                            <td>Population</td>
                            <td class="text-end" id="modalPopulation"></td>
                        </tr>
                        <tr>
                            <td class="text-center"><i class="fa-solid fa-money-bill fa-xl text-success"></i></td>
                            <td>Currency</td>
                            <td class="text-end" id="modalCurrency"></td>
                        </tr>
                        <tr>
                            <td class="text-center"><i class="fa-solid fa-cloud-sun fa-xl text-success"></i></td>
                            <td>Weather</td>
                            <td class="text-end" id="modalWeather"></td>
                        </tr>
                        <tr>
                            <td class="text-center"><i class="fa-solid fa-clock fa-xl text-success"></i></td>
                            <td>Timezone</td>
                            <td class="text-end" id="modalTimezone"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-success btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="Js/bootstrap.bundle.min.js"></script>
    <script src="Js/jquery-3.7.1.min.js"></script>
    <script src="Js/leaflet.js"></script>
    <script src="Js/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-easybutton/2.4.0/easy-button.min.js"></script>
    <script src="Js/script.js"></script>
</body>
</html>
