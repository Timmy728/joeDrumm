<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazetteer Map</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="css/leaflet.css">
    <!-- EasyButton CSS -->
    <link rel="stylesheet" href="css/easy-button.css">
    <- EasyButton Js -->
    <script src="Js/easy-button.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Country Selection Dropdown -->
    <span id="selectContainer">
        <select id="countrySelect" class="form-select shadow-sm">
            <option value="">Select a Country</option>
        </select>
    </span>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- JS Libraries -->
    <script src="Js/bootstrap.bundle.min.js"></script>
    <script src="Js/jquery-3.7.1.min.js"></script>
    <script src="Js/leaflet.js"></script>
    <script>
        
        let map;
        $(document).ready(function () {
            // Initialize the map
            map = L.map('map').setView([20, 0], 2); // Centered globally

            // Add OpenStreetMap tile layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Populate dropdown from restcountries.org
            $.ajax({
                url: "https://restcountries.com/v3.1/all",
                method: "GET",
                dataType: "json",
                success: function (data) {
                    const dropdown = $("#countrySelect");
                    dropdown.empty();
                    dropdown.append(new Option("Select a Country", ""));
                    
                    data.sort((a, b) => a.name.common.localeCompare(b.name.common)); 

                    data.forEach(country => {
                        const iso2 = country.cca2;
                        const name = country.name.common;
                        if (iso2 && name) {
                            dropdown.append(new Option(name, iso2));
                        }
                    });
                },
                error: function (error) {
                    console.error("Error fetching country list:", error);
                }
            });

            // On country selection, zoom to that country
            $('#countrySelect').change(function () {
                const selectedCountry = $(this).val();
                if (selectedCountry) {
                    $.ajax({
                        url: `https://restcountries.com/v3.1/alpha/${selectedCountry}`,
                        method: "GET",
                        dataType: "json",
                        success: function (data) {
                            if (data && data[0] && data[0].latlng) {
                                const [lat, lng] = data[0].latlng;
                                map.setView([lat, lng], 5); // Zoom to the selected country
                            }
                        },
                        error: function (error) {
                            console.error("Error fetching country data:", error);
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
