<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Gazetteer</title>

    <!-- Import Bootstrap CSS via @import in style.css (or directly here) -->
    <link rel="stylesheet" href="css/style.css" />
    <style>
      @import url('https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css');
    </style>
  </head>
  <body>
    <!-- Loader -->
    <div id="preloader">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Weather Modal -->
    <div class="modal" id="weatherModal">
      <div class="modal-content">
        <div class="modal-header">
          <h4>Country Weather: <span id="weatherCountry"></span></h4>
          <button class="close" onclick="closeModal('weatherModal')">&times;</button>
        </div>
        <div class="modal-body">
          <div id="pre-load"></div>
          <p id="conditionsToday"></p>
          <p id="tempToday"></p>
          <div id="forecast-container"></div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('weatherModal')">Close</button>
        </div>
      </div>
    </div>

    <!-- Wikipedia Modal -->
    <div class="modal" id="wikiModal">
      <div class="modal-content">
        <div class="modal-header">
          <h4 id="wikiModalLabel">Wiki Information For: <span id="wiki-title"></span></h4>
          <button class="close" onclick="closeModal('wikiModal')">&times;</button>
        </div>
        <div class="modal-body">
          <div class="wikiImg" id="wiki-img"></div>
          <div class="wikiInfo" id="wiki-info"></div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('wikiModal')">Close</button>
        </div>
      </div>
    </div>

    <!-- Currency Modal -->
    <div class="modal" id="currencyModal">
      <div class="modal-content">
        <div class="modal-header">
          <h4 id="currencyModalLabel">Currency Information <span id="CurrencyCountryName"></span></h4>
          <button class="close" onclick="closeModal('currencyModal')">&times;</button>
        </div>
        <div class="modal-body">
          <table class="table">
            <tbody>
              <tr>
                <td>Name:</td>
                <td id="txtCurrencyName"></td>
              </tr>
              <tr>
                <td>Code:</td>
                <td id="txtCurrencyCode"></td>
              </tr>
              <tr>
                <td>Symbol:</td>
                <td id="txtCurrencySymbol"></td>
              </tr>
              <tr>
                <td>Exchange Rate:</td>
                <td id="txtCurrencyRate"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('currencyModal')">Close</button>
        </div>
      </div>
    </div>

    <!-- Country Information Modal -->
    <div class="modal" id="countryModal">
      <div class="modal-content">
        <div class="modal-header">
          <h4 id="countryModalLabel">Country Information For <span id="countryNames"></span></h4>
          <button class="close" onclick="closeModal('countryModal')">&times;</button>
        </div>
        <div class="modal-body">
          <table class="table">
            <tr>
              <td>ISO 2:</td>
              <td id="iso2"></td>
            </tr>
            <tr>
              <td>ISO 3:</td>
              <td id="iso3"></td>
            </tr>
            <tr>
              <td>Population:</td>
              <td id="population"></td>
            </tr>
            <tr>
              <td>Currency:</td>
              <td id="currencyName"></td>
            </tr>
            <tr>
              <td>Currency Symbol:</td>
              <td id="currencySymbol"></td>
            </tr>
            <tr>
              <td>Timezone:</td>
              <td id="timezone"></td>
            </tr>
          </table>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('countryModal')">Close</button>
        </div>
      </div>
    </div>

    <!-- Dropdown and Map -->
    <form>
      <select name="sel-country" id="selCountry" class="form-select"></select>
    </form>
    <div id="map"></div>

    <!-- Link to your custom JavaScript file -->
    <script src="js/script.js"></script>
  </body>
</html>
