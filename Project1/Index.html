  <script>
    // Initialize the map and set the initial view
    var map = L.map('map').setView([51.505, -0.09], 13); // Set a default view (e.g., London)

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Marker Cluster Group
    var markers = L.markerClusterGroup();

    // Example GeoJSON data (replace this with real data)
    var geojsonData = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "geometry": {
            "type": "Point",
            "coordinates": [-0.09, 51.5]
          },
          "properties": {
            "name": "Marker 1",
            "description": "A pretty CSS popup.<br> Easily customizable."
          }
        },
        {
          "type": "Feature",
          "geometry": {
            "type": "Point",
            "coordinates": [-0.12, 51.51]
          },
          "properties": {
            "name": "Marker 2",
            "description": "Another pretty popup.<br> More customizable."
          }
        }
      ]
    };

    // Add GeoJSON data to the map
    L.geoJSON(geojsonData, {
      onEachFeature: function (feature, layer) {
        if (feature.properties && feature.properties.name) {
          layer.bindPopup('<b>' + feature.properties.name + '</b><br>' + feature.properties.description);
        }
        markers.addLayer(layer); // Add to cluster group
      }
    }).addTo(map);

    // Add marker clustering to the map
    map.addLayer(markers);

    // Adjust the map bounds to fit all markers
    map.fitBounds(markers.getBounds());

    // Example: Add custom easy button (e.g., reset view)
    L.easyButton('fa-globe', function () {
      map.setView([51.505, -0.09], 13); // Reset to initial view
    }).addTo(map);
  </script>
