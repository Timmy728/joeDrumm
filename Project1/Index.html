<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazetteer Map</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="css/leaflet.css">
    <!-- EasyButton CSS -->
    <link rel="stylesheet" href="css/leaflet-easybutton.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Country Selection Dropdown Only -->
    <span id="selectContainer">
        <select id="countrySelect" class="form-select shadow-sm">
            <option value="">Select a Country</option>
        </select>
    </span>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- JS Libraries -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/leaflet-easybutton.js"></script>
    <script>
        $(document).ready(function () {
            // Populate dropdown from restcountries.org
            $.ajax({
                url: "https://restcountries.com/v3.1/all",
                method: "GET",
                dataType: "json",
                success: function (data) {
                    const dropdown = $("#countrySelect");
                    dropdown.empty();
                    dropdown.append(new Option("Select a Country", ""));
                    
                    data.sort((a, b) => a.name.common.localeCompare(b.name.common)); // Sort alphabetically

                    data.forEach(country => {
                        const iso2 = country.cca2;
                        const name = country.name.common;
                        if (iso2 && name) {
                            dropdown.append(new Option(name, iso2));
                        }
                    });
                },
                error: function (error) {
                    console.error("Error fetching country list:", error);
                }
            });
        });
    </script>
</body>
</html>
