<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazetteer Map</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="css/leaflet.css">
    <!-- EasyButton CSS -->
    <link rel="stylesheet" href="css/easy-button.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        #selectContainer {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        #countrySelect {
            width: 200px;
            padding: 5px;
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Country Selection Dropdown on Map -->
    <div id="map">
        <span id="selectContainer">
            <select id="countrySelect" class="form-select shadow-sm">
                <option value="">Select a Country</option>
            </select>
        </span>
    </div>

    <!-- Country Information Modal -->
    <div class="modal fade" id="countryInfoModal" tabindex="-1" aria-labelledby="countryInfoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content shadow">
                <div class="modal-header bg-success bg-gradient text-white">
                    <h5 class="modal-title" id="countryInfoLabel">Country Information</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Country:</strong> <span id="countryNames"></span></p>
                    <p><strong>Capital City:</strong> <span id="capitalCity"></span></p>
                    <p><strong>Population:</strong> <span id="population"></span></p>
                    <p><strong>Currency:</strong> <span id="currencyName"></span> (<span id="currencySymbol"></span>)</p>
                    <p><strong>Exchange Rate:</strong> <span id="txtCurrencyRate"></span></p>
                    <p><strong>Current Weather:</strong> <span id="weather"></span></p>
                    <p><strong>Temperature:</strong> <span id="tempToday"></span></p>
                    <p><strong>Conditions:</strong> <span id="conditionsToday"></span></p>
                    <p id="weatherImg"></p>
                    <p><strong>10-Day Weather Forecast:</strong> <div id="forecastInfo"></div></p>
                    <p><strong>Wikipedia Search:</strong> <a id="wikiLink" href="#" target="_blank">View on Wikipedia</a></p>
                    <p><strong>Timezone:</strong> <span id="timezone"></span></p>
                    <p><strong>Recent Earthquakes:</strong> <span id="earthquakeList"></span></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-success btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/easy-button.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
