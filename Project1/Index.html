<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazetteer</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="css/leaflet.css">
    <!-- Leaflet Marker Cluster CSS -->
    <link rel="stylesheet" href="css/MarkerCluster.css">
    <link rel="stylesheet" href="css/MarkerCluster.Default.css">
    <!-- EasyButton CSS -->
    <link rel="stylesheet" href="css/easy-button.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" sizes="132x132" href="/Project1/Images/Favicon.png">
</head>
<body>
    <div id="pre-loader"></div>
    
    <!-- Country Selection Dropdown on Map -->
    <div id="map">
        <span id="selectContainer">
            <select id="countrySelect" class="form-select shadow-sm">
                <option value="">Select a Country</option>
            </select>
        </span>
    </div>

    <!-- Modals for 5 Different Easy Buttons -->
    <!-- Button 1 -->
    <div id="modals-container">
        <div id="infoModal1" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title">Country Info</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Country:</strong> <span id="countryNames"></span> <img id="countryFlag" src="" alt="" width="30" style="display:none;"></p>
                        <p><strong>Capital City:</strong> <span id="capitalCity"></span></p>
                        <p><strong>Population:</strong> <span id="population"></span></p>
                        <p><strong>Timezone:</strong> <span id="timezone"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal for Nearby Information (Button 2) -->
        <div id="infoModal2" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title">Nearby Information</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Nearby Streets:</strong> <span id="nearbyStreets"></span></p>
                        <p><strong>Nearby Places:</strong> <span id="nearbyPlaces"></span></p>
                        <p><strong>Elevation:</strong> <span id="elevation"></span></p>
                        <p><strong>Geocoded Address:</strong> <span id="geoAddress"></span></p>
                    </div>
                </div>
            </div>
        </div>
        
          <!-- Currency Modal (Button 3) -->
        <div id="currencyModal" class="modal fade" tabindex="-1" data-bs-backdrop="false" data-bs-keyboard="false">
            <div class="modal-dialog modal-sm modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content shadow">
                    <div class="modal-header bg-secondary bg-gradient text-white">
                        <h5 class="modal-title"><i class="fa-solid fa-money-bill-transfer me-2"></i>Currency calculator</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="form-floating mb-3">
                                <input id="fromAmount" type="number" class="form-control" value="1" min="1" step="1">
                                <label><i class="fas fa-dollar-sign"></i> From USD</label>
                            </div>

                            <div class="form-floating mb-3">
                                <select id="currencies" class="form-select">
                                    <option value="EUR">€ EUR - Euro</option>
                                    <option value="GBP">£ GBP - British Pound</option>
                                    <option value="JPY">¥ JPY - Japanese Yen</option>
                                    <option value="AUD">A$ AUD - Australian Dollar</option>
                                    <option value="CAD">C$ CAD - Canadian Dollar</option>
                                    <option value="CHF">Fr CHF - Swiss Franc</option>
                                    <option value="CNY">¥ CNY - Chinese Yuan</option>
                                    <option value="INR">₹ INR - Indian Rupee</option>
                                </select>
                                <label for="exchangeRate">Convert to</label>
                            </div>

                            <div class="form-floating">
                                <input id="toAmount" type="text" class="form-control" disabled>
                                <label for="toAmount" id="resultLabel">Result</label>
                            </div>

                            <div class="exchange-rate-display mt-3 text-center">
                                <small class="text-muted" id="txtCurrencyRate"></small>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm myBtn" data-bs-dismiss="modal">CLOSE</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Button 4 -->
        <div id="infoModal4" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title">Current Weather</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Temperature:</strong> <span id="tempToday"></span></p>
                        <p><strong>Conditions:</strong> <span id="conditionsToday"></span></p>
                        <p id="weatherImg"></p>
                        <h4 class="modal-title">10-Day Weather Forecast</h4>
                        <div id="forecastInfo"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Button 5 -->
        <div id="infoModal5" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title">Wikipedia Summary</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <ul id="wikiArticles"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="Js/jquery-3.7.1.min.js"></script>
    <script src="Js/bootstrap.bundle.min.js"></script>
    <script src="Js/leaflet.js"></script>
    <script src="Js/leaflet.markercluster.js"></script>
    <script src="Js/easy-button.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/numeral.js/2.0.6/numeral.min.js"></script>
    <script src="Js/script.js"></script>
</body>
</html>
