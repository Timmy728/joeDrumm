<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Gazetteer</title>

    <!-- Bootstrap CSS (Local) -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <!-- Leaflet CSS (Local) -->
    <link rel="stylesheet" href="css/leaflet.css" />

    <!-- MarkerCluster CSS (Local) -->
    <link rel="stylesheet" href="css/leaflet.markercluster.css" />
    <link rel="stylesheet" href="css/MarkerCluster.Default.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Loader -->
    <div id="preloader">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Country Information -->
    <div class="container">
      <h1>Country Information</h1>
      <form>
        <label for="selCountry">Select Country:</label>
        <select name="sel-country" id="selCountry" class="form-select" aria-label="Select Country"></select>
      </form>

      <!-- Country Information -->
      <div id="countryInfo">
        <p><strong>Country:</strong> <span id="countryNames"></span></p>
        <p><strong>ISO2 Code:</strong> <span id="iso2"></span></p>
        <p><strong>ISO3 Code:</strong> <span id="iso3"></span></p>
        <p><strong>Population:</strong> <span id="population"></span></p>
        <p><strong>Capital City:</strong> <span id="capitalCity"></span></p>
        <p><strong>Timezone:</strong> <span id="timezone"></span></p>
        <p><strong>Currency:</strong> <span id="currencyName"></span> (<span id="currencySymbol"></span>)</p>
        <p><strong>Currency Code:</strong> <span id="txtCurrencyCode"></span></p>
        <p><strong>Exchange Rate:</strong> <span id="txtCurrencyRate"></span></p>
      </div>
    </div>

    <!-- Map -->
    <div id="map" style="height: 500px;"></div>

    <!-- Weather Modal -->
    <div class="modal" id="weatherModal">
      <div class="modal-content">
        <div class="modal-header">
          <h4>Country Weather: <span id="weatherCountry"></span></h4>
          <button class="close" onclick="closeModal('weatherModal')">&times;</button>
        </div>
        <div class="modal-body">
          <p id="conditionsToday"></p>
          <p id="tempToday"></p>
          <div id="weatherImg"></div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('weatherModal')">Close</button>
        </div>
      </div>
    </div>

    <!-- Earthquake Modal -->
    <div class="modal" id="earthquakeModal">
      <div class="modal-content">
        <div class="modal-header">
          <h4>Earthquakes Information</h4>
          <button class="close" onclick="closeModal('earthquakeModal')">&times;</button>
        </div>
        <div class="modal-body">
          <div id="earthquakeInfo"></div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('earthquakeModal')">Close</button>
        </div>
      </div>
    </div>

    <!-- Wikipedia Modal -->
    <div class="modal" id="wikiModal">
      <div class="modal-content">
        <div class="modal-header">
          <h4 id="wikiModalLabel">Wikipedia Information For: <span id="wiki-title"></span></h4>
          <button class="close" onclick="closeModal('wikiModal')">&times;</button>
        </div>
        <div class="modal-body">
          <div class="wikiImg" id="wiki-img"></div>
          <div class="wikiInfo" id="wiki-info"></div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal('wikiModal')">Close</button>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS (Local) -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- jQuery (Local) -->
    <script src="js/jquery-3.7.1.min.js"></script>

    <!-- Leaflet JS (Local) -->
    <script src="js/leaflet.js"></script>

    <!-- MarkerCluster JS (Local) -->
    <script src="js/leaflet.markercluster.js"></script>

    <!-- Custom Script (Local) -->
    <script src="js/script.js"></script>
  </body>
</html>
