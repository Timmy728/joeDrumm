<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazetteer</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="css/leaflet.css">
    <!-- EasyButton CSS -->
    <link rel="stylesheet" href="css/easy-button.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Leaflet ExtraMarkers CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-extra-markers/1.2.1/css/leaflet.extra-markers.min.css">
</head>
<body>
    <!-- Country Selection Dropdown on Map -->
    <div id="map">
        <span id="selectContainer">
            <select id="countrySelect" class="form-select shadow-sm">
                <option value="">Select a Country</option>
            </select>
        </span>
    </div>

    <!-- JS Libraries (Order is Important) -->
    <script src="Js/jquery-3.7.1.min.js"></script>
    <script src="Js/bootstrap.bundle.min.js"></script>

    <!-- Load Leaflet Core FIRST -->
    <script src="Js/leaflet.js"></script>

    <!-- Load Leaflet ExtraMarkers AFTER Leaflet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-extra-markers/1.2.1/js/leaflet.extra-markers.min.js"></script>

    <!-- Load EasyButton -->
    <script src="Js/easy-button.js"></script>

    <!-- Load Main Script -->
    <script src="Js/script.js"></script>
</body>
</html>
