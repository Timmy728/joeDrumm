<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title -->
    <title>Company Directory</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    
    <!-- FontAwesome (for icons) -->
    <link rel="stylesheet" href="assets/css/fontawesome.css">
    <link rel="stylesheet" href="assets/css/solid.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section>

  <div class="appHeader">
    <div class="row">
      <div class="col">
        <input id="searchInp" class="form-control mb-3" placeholder="search">
      </div>
      <div class="col-6 text-end me-2">
        <div class="btn-group" role="group" aria-label="buttons">
          <button id="refreshBtn" type="button" class="btn btn-primary">
            <i class="fa-solid fa-arrows-rotate fa-fw"></i>
          </button>
          <button id="filterBtn" type="button" class="btn btn-primary">
            <i class="fa-solid fa-filter fa-fw"></i>
          </button>          
          <button id="addBtn" type="button" class="btn btn-primary">
            <i class="fa-solid fa-plus fa-fw"></i>
          </button>
        </div>
      </div>
    </div>

    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="personnelBtn" data-bs-toggle="tab" data-bs-target="#personnel-tab-pane" type="button">
            <i class="fa-solid fa-users fa-lg fa-fw"></i><span class="d-none d-sm-block">Personnel</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="departmentsBtn" data-bs-toggle="tab" data-bs-target="#departments-tab-pane" type="button">
            <i class="fa-solid fa-building-user fa-lg fa-fw"></i><span class="d-none d-sm-block">Departments</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="locationsBtn" data-bs-toggle="tab" data-bs-target="#locations-tab-pane" type="button">
            <i class="fa-solid fa-map-location-dot fa-lg fa-fw"></i><span class="d-none d-sm-block">Locations</span>
          </button>
        </li>
    </ul>

  </div>

  <div class="tab-content bg-white">

    <div class="tab-pane show active" id="personnel-tab-pane">
      <table class="table table-hover">
        <tbody id="personnelTableBody">
          <!-- Data loaded dynamically here -->
        </tbody>
      </table>
    </div>

    <div class="tab-pane" id="departments-tab-pane">

      <table class="table table-hover">
        <tbody id="departmentTableBody">

          <!-- Add Department Modal -->
<div id="addDepartmentModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="addDepartmentModalLabel">
  <div class="modal-dialog modal-sm modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="addDepartmentModalLabel">Add Department</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form id="addDepartmentForm">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="addDepartmentName" placeholder="Department Name" required>
            <label for="addDepartmentName">Department Name</label>
          </div>

          <div class="form-floating">
            <select class="form-select" id="addDepartmentLocation">
              <option value="">Select Location</option>
              <!-- Locations will be loaded dynamically -->
            </select>
            <label for="addDepartmentLocation">Location</label>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="submit" form="addDepartmentForm" class="btn btn-outline-primary btn-sm text-uppercase">SAVE</button>
        <button type="button" class="btn btn-outline-primary btn-sm text-uppercase" data-bs-dismiss="modal">CANCEL</button>
      </div>
    </div>
  </div>
</div>
        </tbody>
      </table>
    </div>

    <!-- Edit Department Modal -->
      <div id="editDepartmentModal" class="modal fade" tabindex="-1">
      <div class="modal-dialog modal-sm modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content shadow">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">Edit Department</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="editDepartmentForm">
              <input type="hidden" id="editDepartmentID">
              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="editDepartmentName" placeholder="Department Name" required>
                <label for="editDepartmentName">Department Name</label>
              </div>
              <div class="form-floating">
                <select class="form-select" id="editDepartmentLocation"></select>
                <label for="editDepartmentLocation">Location</label>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="submit" form="editDepartmentForm" class="btn btn-outline-primary btn-sm text-uppercase">SAVE</button>
            <button type="button" class="btn btn-outline-primary btn-sm text-uppercase" data-bs-dismiss="modal">CANCEL</button>
          </div>
        </div>
      </div>
    </div>


    <div class="tab-pane" id="locations-tab-pane">


<table class="table table-hover">
  <tbody id="locationTableBody">
    <!-- Data loaded dynamically here -->
  </tbody>
</table>



<!-- Add Location Modal -->
<div id="addLocationModal" class="modal fade" tabindex="-1" data-bs-backdrop="false">
  <div class="modal-dialog modal-sm modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Add Location</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addLocationForm">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="addLocationName" placeholder="Location Name" required>
            <label for="addLocationName">Location Name</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="addLocationForm" class="btn btn-outline-primary btn-sm text-uppercase">SAVE</button>
        <button type="button" class="btn btn-outline-primary btn-sm text-uppercase" data-bs-dismiss="modal">CANCEL</button>
      </div>
    </div>
  </div>
</div>

        <tbody id="locationTableBody">
          <!-- Data loaded dynamically here -->
        </tbody>
      </table>
    </div>

  </div>
  
  <footer class="border-top text-center fw-bold">
    <p class="fw-light my-3">Company Directory version 1.0</p>
  </footer>

</section>

<!-- Add Personnel Modal -->
<div id="addPersonnelModal" class="modal fade" tabindex="-1" data-bs-backdrop="false">
  <div class="modal-dialog modal-sm modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Add Employee</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="addPersonnelForm">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="addPersonnelFirstName" placeholder="First name" required>
            <label for="addPersonnelFirstName">First name</label>
          </div>

          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="addPersonnelLastName" placeholder="Last name" required>
            <label for="addPersonnelLastName">Last name</label>
          </div>

          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="addPersonnelJobTitle" placeholder="Job title">
            <label for="addPersonnelJobTitle">Job Title</label>
          </div>          

          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="addPersonnelEmailAddress" placeholder="Email address" required>
            <label for="addPersonnelEmailAddress">Email Address</label>
          </div>    

          <div class="form-floating">
            <select class="form-select" id="addPersonnelDepartment">
              <option value="">Unassigned</option>
              <!-- Department options will be loaded dynamically -->
            </select>
            <label for="addPersonnelDepartment">Department</label>
          </div>  
        </form>
      </div>

      <div class="modal-footer">
        <button type="submit" form="addPersonnelForm" class="btn btn-outline-primary btn-sm text-uppercase">SAVE</button>
        <button type="button" class="btn btn-outline-primary btn-sm text-uppercase" data-bs-dismiss="modal">CANCEL</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Personnel Modal -->
<div id="editPersonnelModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="editPersonnelModalLabel">
  <div class="modal-dialog modal-sm modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id=editPersonnelModalLabel">Edit Employee</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form id="editPersonnelForm">
          <input type="hidden" id="editPersonnelEmployeeID">

          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="editPersonnelFirstName" placeholder="First name" required>
            <label for="editPersonnelFirstName">First name</label>
          </div>

          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="editPersonnelLastName" placeholder="Last name" required>
            <label for="editPersonnelLastName">Last name</label>
          </div>

          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="editPersonnelJobTitle" placeholder="Job title" required>
            <label for="editPersonnelJobTitle">Job Title</label>
          </div>          

          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="editPersonnelEmailAddress" placeholder="Email address" required>
            <label for="editPersonnelEmailAddress">Email Address</label>
          </div>    

          <div class="form-floating">
            <select class="form-select" id="editPersonnelDepartment">
            </select>
            <label for="editPersonnelDepartment">Department</label>
          </div>  
        </form>
      </div>

      <div class="modal-footer">
        <button type="submit" form="editPersonnelForm" class="btn btn-outline-primary btn-sm text-uppercase">SAVE</button>
        <button type="button" class="btn btn-outline-secondary btn-sm text-uppercase" data-bs-dismiss="modal">CANCEL</button>
      </div>
    </div>
  </div>
</div>


<!-- Edit Location Modal -->
<div id="editLocationModal" class="modal fade" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Edit Location</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editLocationForm">
          <input type="hidden" id="editLocationID">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="editLocationName" placeholder="Location Name" required>
            <label for="editLocationName">Location Name</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="editLocationForm" class="btn btn-outline-primary btn-sm text-uppercase">SAVE</button>
        <button type="button" class="btn btn-outline-primary btn-sm text-uppercase" data-bs-dismiss="modal">CANCEL</button>
      </div>
    </div>
  </div>
</div>


<!-- Filter Modal -->
<div id="filterModal" class="modal fade" tabindex="-1" data-bs-backdrop="false">
  <div class="modal-dialog modal-sm modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Filter by</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="filterForm">
          <div class="form-floating mb-3">
            <select class="form-select" id="filterDepartment">
              <option value="">Select Department</option>
              <!-- Populated dynamically -->
            </select>
            <label for="filterDepartment">Department</label>
          </div>

          <div class="form-floating">
            <select class="form-select" id="filterLocation">
              <option value="">Select Location</option>
              <!-- Populated dynamically -->
            </select>
            <label for="filterLocation">Location</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-primary btn-sm text-uppercase" id="applyFilterBtn">APPLY</button>
        <button type="button" class="btn btn-outline-primary btn-sm text-uppercase" data-bs-dismiss="modal">CANCEL</button>
      </div>
    </div>
  </div>
</div>


<!-- Confirm Delete Modal -->
<div id="confirmDeleteModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="confirmDeleteModalLabel">
  <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
    <div class="modal-content shadow">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="confirmDeleteModalLabel">CONFIRM DELETE</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="confirmDeleteMessage">Are you sure?</p>
        <form id="confirmDeleteForm">
          <input type="hidden" id="deleteEntityID">
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="confirmDeleteForm" class="btn btn-outline-danger btn-sm text-uppercase">YES</button>
        <button type="button" class="btn btn-outline-primary btn-sm text-uppercase" data-bs-dismiss="modal">CANCEL</button>
      </div>
    </div>
  </div>
</div>


    
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
  <div id="statusToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="statusToastMessage">
        ✅ Action completed!
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- jQuery (Local) -->
<script src="assets/js/jquery.min.js"></script>
<!-- Bootstrap JS Bundle (Local) -->
<script src="assets/js/bootstrap.bundle.min.js"></script>
<!-- Custom Script -->
<script src="Php/script.js"></script>

</body>
</html>
